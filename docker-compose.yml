version: '3.8'

services:
  hkmu-attendance:
    build: .
    container_name: hkmu-attendance-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Hong_Kong
      - PYTHONUNBUFFERED=1
      # Copy from .env file or set directly:
      # - STUDENT_ID=your_student_id
      # - STUDENT_PASSWORD=your_password
      # - DISCORD_WEBHOOK=your_webhook_url
    env_file:
      - .env  # Load from .env file if it exists
    volumes:
      # Optional: Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'